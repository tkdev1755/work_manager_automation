[project]
name = "wm-automation"
version = "0.1.0"
description = "Brique 2: personal application-automation pipeline consuming the work_manager MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
wm-automation-mcp = "wm_automation.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
